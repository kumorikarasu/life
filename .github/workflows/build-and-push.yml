name: Build and Push Docker Images

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: registry.home.ryougi.ca

jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Generate short SHA
      id: vars
      run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: ./back/api
        file: ./back/api/Dockerfile
        target: prod
        push: true
        tags: |
          ${{ env.REGISTRY }}/simbru-api:${{ steps.vars.outputs.short_sha }}
          ${{ env.REGISTRY }}/simbru-api:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./front
        file: ./front/Dockerfile
        target: prod
        push: true
        tags: |
          ${{ env.REGISTRY }}/simbru-pwa:${{ steps.vars.outputs.short_sha }}
          ${{ env.REGISTRY }}/simbru-pwa:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Update Helm chart appVersion
      run: |
        # Update chart appVersion with git SHA for tracking
        sed -i "s/appVersion: \"1.16.0\"/appVersion: \"${{ steps.vars.outputs.short_sha }}\"/" ./helm/Chart.yaml

    - name: Generate GitHub App Token
      id: generate_token
      uses: tibdex/github-app-token@v1
      with:
        app_id: ${{ secrets.APP_ID }}
        private_key: ${{ secrets.APP_PRIVATE_KEY }}
        repository: kumorikarasu/home

    - name: Update ArgoCD repository with new image tags
      env:
        ARGOCD_REPO_TOKEN: ${{ steps.generate_token.outputs.token }}
      run: |
        # Clone the ArgoCD home repository
        git clone https://github.com/kumorikarasu/home.git argocd-repo
        cd argocd-repo
        
        # Update the life app-apps values with new image tags
        sed -i "/life:/,$ s/tag: \".*\"/tag: \"${{ steps.vars.outputs.short_sha }}\"/" argocd/app-apps/life/values.yaml
        
        # Commit and push changes
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add argocd/app-apps/life/values.yaml
        git commit -m "Update life application to image SHA ${{ steps.vars.outputs.short_sha }}" || exit 0
        git push https://x-access-token:${ARGOCD_REPO_TOKEN}@github.com/kumorikarasu/home.git

    - name: Image digest
      run: |
        echo "API Image pushed with SHA: ${{ steps.vars.outputs.short_sha }}"
        echo "Frontend Image pushed with SHA: ${{ steps.vars.outputs.short_sha }}"
        echo "ArgoCD repository updated with imageTag: ${{ steps.vars.outputs.short_sha }}"