name: Build and Push Docker Images

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: registry.home.ryougi.ca

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: '3.12.0'

    - name: Run Helm chart tests
      run: make test-helm

  build-and-push:
    runs-on: self-hosted
    needs: test
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: ./back/api
        file: ./back/api/Dockerfile
        target: prod
        push: true
        tags: |
          ${{ env.REGISTRY }}/simbru-api:${{ github.sha }}
          ${{ env.REGISTRY }}/simbru-api:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./front
        file: ./front/Dockerfile
        target: prod
        push: true
        tags: |
          ${{ env.REGISTRY }}/simbru-pwa:${{ github.sha }}
          ${{ env.REGISTRY }}/simbru-pwa:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Update Helm chart appVersion
      run: |
        # Update chart appVersion with git SHA for tracking
        sed -i "s/appVersion: \"1.16.0\"/appVersion: \"${{ github.sha }}\"/" ./helm/Chart.yaml

    - name: Image digest
      run: |
        echo "API Image pushed with SHA: ${{ github.sha }}"
        echo "Frontend Image pushed with SHA: ${{ github.sha }}"